# Noticias con la reacción del precio: cada 5 minutos lee los feeds, mide cómo reaccionó el mercado y deja el
# resultado en la rama "datos" (noticias.json). El panel lo lee desde raw.githubusercontent.com, así no se
# reconstruye la página cada 5 minutos. En repos públicos los minutos de Actions son gratis.
name: Noticias

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: noticias
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer noticias y medir la reacción del precio
        run: python noticias/noticias_panel.py salida/noticias.json
      - name: Guardar en la rama datos (un solo commit, sin historial)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd salida
          git init -q -b datos
          git config user.name "noticias-del-panel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -q -m "Noticias $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" datos
